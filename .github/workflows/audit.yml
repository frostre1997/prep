name: audit

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  self-audit:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Build prep
      run: cargo build --release
    - name: Run prep audit
      run: target/release/prep audit --verbose
    - name: Run prep fix --dry-run
      run: target/release/prep fix --dry-run
    - name: Generate manifest
      run: target/release/prep manifest --out manifest.txt
    - uses: actions/upload-artifact@v4
      with:
        name: manifest
        path: manifest.txt
