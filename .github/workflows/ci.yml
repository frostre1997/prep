name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Lint with clippy
      run: cargo clippy -- -D warnings
    - name: Build (release)
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Upload binary (Linux)
      if: matrix.rust == 'stable'
      uses: actions/upload-artifact@v4
      with:
        name: prep-${{ runner.os }}
        path: target/release/prep

  self-audit:
    name: Self-Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Build prep
      run: cargo build --release
    - name: Run prep audit on itself
      run: target/release/prep audit --verbose
    - name: Run prep fix --dry-run
      run: target/release/prep fix --dry-run
    - name: Generate manifest
      run: target/release/prep manifest --out manifest.txt
    - uses: actions/upload-artifact@v4
      with:
        name: manifest
        path: manifest.txt

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: self-audit
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Build prep
      run: cargo build --release
    - name: Generate HTML report
      run: target/release/prep report --format html --output report.html --all
    - uses: actions/upload-artifact@v4
      with:
        name: prep-report
        path: report.html

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, self-audit, report]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Install cross
      run: cargo install cross
    - name: Build and upload binaries
      uses: taiki-e/upload-rust-binary-action@v1
      with:
        bin: prep
        target: |
          x86_64-unknown-linux-gnu
          i686-unknown-linux-gnu
          aarch64-unknown-linux-gnu
          armv7-unknown-linux-gnueabihf
          arm-unknown-linux-gnueabihf
          x86_64-pc-windows-gnu
          i686-pc-windows-gnu
          x86_64-apple-darwin
          aarch64-apple-darwin
        build-tool: cross
        archive: $bin-$target
        include: README.md, LICENSE
        token: ${{ secrets.GITHUB_TOKEN }}
