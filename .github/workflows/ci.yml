name: CI

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Lint with clippy
      run: cargo clippy -- -D warnings

    - name: Build (release)
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Upload binary (Linux)
      if: matrix.rust == 'stable'
      uses: actions/upload-artifact@v4
      with:
        name: prep-${{ runner.os }}
        path: target/release/prep

  self-audit:
    name: Self-Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Build prep
      run: cargo build --release
    - name: Run prep audit on itself
      run: target/release/prep audit --verbose
    - name: Run prep fix --dry-run
      run: target/release/prep fix --dry-run
    - name: Generate manifest
      run: target/release/prep manifest --out manifest.txt
    - uses: actions/upload-artifact@v4
      with:
        name: manifest
        path: manifest.txt

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: self-audit
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - name: Build prep
      run: cargo build --release
    - name: Generate HTML report
      run: target/release/prep report --format html --output report.html --all
    - uses: actions/upload-artifact@v4
      with:
        name: prep-report
        path: report.html

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, self-audit, report]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
    - run: |
        rustup target add x86_64-unknown-linux-gnu
        rustup target add x86_64-apple-darwin
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --target x86_64-unknown-linux-gnu
        cargo build --release --target x86_64-apple-darwin
        cargo build --release --target x86_64-pc-windows-gnu
    - run: |
        mkdir -p release
        cp target/x86_64-unknown-linux-gnu/release/prep release/prep-linux
        cp target/x86_64-apple-darwin/release/prep release/prep-macos
        cp target/x86_64-pc-windows-gnu/release/prep.exe release/prep-windows.exe
        cd release && tar -czf prep-linux.tar.gz prep-linux
        cd release && tar -czf prep-macos.tar.gz prep-macos
        cd release && zip prep-windows.zip prep-windows.exe
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          release/prep-linux.tar.gz
          release/prep-macos.tar.gz
          release/prep-windows.zip
          report.html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
