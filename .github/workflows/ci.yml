name: CI

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        override: true
        components: rustfmt, clippy
    - uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - run: cargo fmt -- --check
    - run: cargo clippy -- -D warnings
    - run: cargo build --release --verbose
    - run: cargo test --verbose
    - uses: actions/upload-artifact@v4
      if: matrix.rust == 'stable'
      with:
        name: prep-${{ runner.os }}
        path: target/release/prep

  self-audit:
    name: Self-Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - run: cargo build --release
    - run: target/release/prep audit --verbose
    - run: target/release/prep fix --dry-run
    - run: target/release/prep manifest --out manifest.txt
    - uses: actions/upload-artifact@v4
      with:
        name: manifest
        path: manifest.txt

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: self-audit
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - run: cargo build --release
    - run: target/release/prep report --format html --output report.html --all
    - uses: actions/upload-artifact@v4
      with:
        name: prep-report
        path: report.html

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, self-audit, report]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    - run: |
        rustup target add x86_64-unknown-linux-gnu
        rustup target add x86_64-apple-darwin
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --target x86_64-unknown-linux-gnu
        cargo build --release --target x86_64-apple-darwin
        cargo build --release --target x86_64-pc-windows-gnu
    - run: |
        mkdir -p release
        cp target/x86_64-unknown-linux-gnu/release/prep release/prep-linux
        cp target/x86_64-apple-darwin/release/prep release/prep-macos
        cp target/x86_64-pc-windows-gnu/release/prep.exe release/prep-windows.exe
        cd release && tar -czf prep-linux.tar.gz prep-linux
        cd release && tar -czf prep-macos.tar.gz prep-macos
        cd release && zip prep-windows.zip prep-windows.exe
    - uses: softprops/action-gh-release@v1
      with:
        files: |
          release/prep-linux.tar.gz
          release/prep-macos.tar.gz
          release/prep-windows.zip
          report.html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
