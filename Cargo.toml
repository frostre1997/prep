[package]
name = "prep"
version = "0.100.0"
edition = "2026"
authors = ["frostre1997 <n9043395@gmail.com>"]
description = "a repository health auditor and build error parser"
license = "MIT"
repository = "https://github.com/frostre1997/prep"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
regex = "1.10"
walkdir = "2.5"
anyhow = "1.0"
sha2 = "0.10"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
ignore = "0.4"
rayon = "1.10"
indicatif = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
